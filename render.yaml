# Render blueprint for the API (NestJS). The app talks to this service through API_BASE_URL.
# Secrets are set in the Render dashboard (sync: false) and never live in this repo.
services:
  - type: web
    name: nina-api
    runtime: node
    region: virginia
    plan: free
    branch: main
    autoDeploy: true
    # devDependencies are needed to compile, so they are installed on purpose.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: openai
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: USD_PEN_RATE
        sync: false
